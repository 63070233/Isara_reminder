<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>ISARA — กรมธรรม์ของฉัน</title>
  <script src="config.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:   #06c755;
      --green-d: #04a344;
      --red:     #e53935;
      --orange:  #fb8c00;
      --blue:    #1565c0;
      --gray:    #f4f6f8;
      --text:    #212121;
      --sub:     #757575;
      --card:    #ffffff;
      --border:  #e0e0e0;
      --radius:  14px;
    }
    body {
      font-family: 'Segoe UI', 'Noto Sans Thai', sans-serif;
      background: var(--gray);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Screens ── */
    .screen { display: none; }
    .screen.active { display: block; }

    /* ── Loading ── */
    #screen-loading {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; gap: 16px;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--sub); font-size: 14px; }

    /* ── Top Bar ── */
    .topbar {
      background: var(--green);
      color: #fff;
      padding: 14px 16px 12px;
      display: flex; align-items: center; gap: 10px;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .topbar-logo { font-size: 20px; }
    .topbar-title { font-weight: 700; font-size: 16px; flex: 1; }
    .topbar-name { font-size: 12px; opacity: .85; text-align: right; max-width: 100px; line-height: 1.3; }

    /* ── Tab Bar ── */
    .tabbar {
      display: flex; background: #fff;
      border-bottom: 2px solid var(--border);
      position: sticky; top: 52px; z-index: 99;
    }
    .tab-btn {
      flex: 1; padding: 12px 4px; font-size: 13px; font-weight: 600;
      border: none; background: none; color: var(--sub); cursor: pointer;
      border-bottom: 3px solid transparent; margin-bottom: -2px;
      transition: color .2s, border-color .2s;
    }
    .tab-btn.active { color: var(--green); border-bottom-color: var(--green); }

    /* ── Main Content ── */
    .content { padding: 16px; max-width: 540px; margin: 0 auto; }

    /* ── Cards ── */
    .card {
      background: var(--card); border-radius: var(--radius);
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      padding: 16px; margin-bottom: 14px;
    }
    .card-title {
      font-size: 13px; font-weight: 700; color: var(--sub);
      text-transform: uppercase; letter-spacing: .5px;
      margin-bottom: 12px;
    }

    /* ── Summary Strip ── */
    .summary-strip {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px; margin-bottom: 14px;
    }
    .summary-box {
      background: var(--card); border-radius: var(--radius);
      padding: 14px 10px; text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .summary-box .val { font-size: 22px; font-weight: 800; }
    .summary-box .lbl { font-size: 11px; color: var(--sub); margin-top: 2px; }
    .val.green { color: var(--green); }
    .val.red   { color: var(--red); }
    .val.orange { color: var(--orange); }

    /* ── Outstanding Banner ── */
    .outstanding-banner {
      background: linear-gradient(135deg, #e53935, #c62828);
      color: #fff; border-radius: var(--radius);
      padding: 16px; margin-bottom: 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .outstanding-banner.none {
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
    }
    .ob-label { font-size: 13px; opacity: .9; }
    .ob-amount { font-size: 26px; font-weight: 800; }
    .ob-note { font-size: 11px; opacity: .8; margin-top: 2px; }
    .ob-icon { font-size: 36px; }

    /* ── Vehicle Group ── */
    .vehicle-header {
      display: flex; align-items: center; gap: 8px;
      background: var(--blue); color: #fff;
      border-radius: 10px 10px 0 0; padding: 10px 14px;
      font-weight: 700; font-size: 15px; margin-bottom: 0;
    }
    .vehicle-group { margin-bottom: 16px; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .vehicle-body { background: var(--card); }

    /* ── Installment Row ── */
    .inst-row {
      display: flex; align-items: center; padding: 12px 14px;
      border-bottom: 1px solid var(--border); gap: 10px;
    }
    .inst-row:last-child { border-bottom: none; }
    .inst-num {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; flex-shrink: 0;
    }
    .inst-num.paid { background: #e8f5e9; color: var(--green-d); }
    .inst-num.overdue { background: #ffebee; color: var(--red); }
    .inst-num.upcoming { background: #fff3e0; color: var(--orange); }
    .inst-num.normal { background: #e3f2fd; color: var(--blue); }
    .inst-info { flex: 1; min-width: 0; }
    .inst-policy { font-size: 11px; color: var(--sub); }
    .inst-amount { font-size: 15px; font-weight: 700; }
    .inst-due { font-size: 11px; color: var(--sub); margin-top: 1px; }
    .inst-badge {
      font-size: 11px; font-weight: 700; padding: 3px 8px;
      border-radius: 20px; white-space: nowrap; flex-shrink: 0;
    }
    .badge-paid { background: #e8f5e9; color: var(--green-d); }
    .badge-overdue { background: #ffebee; color: var(--red); }
    .badge-soon { background: #fff3e0; color: var(--orange); }
    .badge-pending { background: #e3f2fd; color: var(--blue); }

    /* ── Progress bar ── */
    .progress-wrap { background: var(--gray); border-radius: 99px; height: 7px; margin-top: 8px; }
    .progress-bar { background: var(--green); border-radius: 99px; height: 7px; transition: width .5s; }
    .progress-label { font-size: 11px; color: var(--sub); margin-top: 4px; text-align: right; }

    /* ── History List ── */
    .hist-row {
      padding: 12px 0; border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; gap: 12px;
    }
    .hist-row:last-child { border-bottom: none; }
    .hist-icon { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
    .hist-info { flex: 1; }
    .hist-title { font-size: 14px; font-weight: 600; }
    .hist-sub { font-size: 12px; color: var(--sub); margin-top: 2px; }
    .hist-amount { font-weight: 700; font-size: 14px; color: var(--green-d); }

    /* ── Empty State ── */
    .empty { text-align: center; padding: 40px 20px; color: var(--sub); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-text { font-size: 15px; }

    /* ── Next Due Banner ── */
    .next-due {
      background: linear-gradient(135deg, #1565c0, #0d47a1);
      color: #fff; border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .nd-label { font-size: 12px; opacity: .85; }
    .nd-val { font-size: 17px; font-weight: 800; }
    .nd-sub { font-size: 11px; opacity: .8; }
    .nd-days { text-align: right; }
    .nd-days-num { font-size: 26px; font-weight: 800; }

    /* ── Registration Form ── */
    .form-hero {
      text-align: center; padding: 24px 16px 16px;
    }
    .form-hero-logo { font-size: 48px; }
    .form-hero-title { font-size: 20px; font-weight: 800; margin: 8px 0 4px; color: var(--blue); }
    .form-hero-sub { font-size: 13px; color: var(--sub); }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 13px; font-weight: 600; margin-bottom: 6px; display: block; }
    .form-input {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 15px; outline: none;
      transition: border-color .2s;
    }
    .form-input:focus { border-color: var(--green); }
    .form-hint { font-size: 11px; color: var(--sub); margin-top: 4px; }
    .btn-submit {
      width: 100%; padding: 14px; background: var(--green);
      color: #fff; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      transition: background .2s; margin-top: 4px;
    }
    .btn-submit:active { background: var(--green-d); }
    .btn-submit:disabled { background: #ccc; cursor: not-allowed; }

    /* ── Success / Error ── */
    .result-box { text-align: center; padding: 32px 20px; }
    .result-icon { font-size: 56px; margin-bottom: 12px; }
    .result-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    .result-sub { font-size: 14px; color: var(--sub); line-height: 1.6; }
    .btn-secondary {
      margin-top: 20px; padding: 12px 28px;
      background: var(--green); color: #fff;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 700;
      cursor: pointer;
    }

    /* ── Profile Header ── */
    .profile-header {
      display: flex; align-items: center; gap: 12px;
      padding: 16px; background: var(--card);
      border-radius: var(--radius); margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .profile-avatar {
      width: 52px; height: 52px; border-radius: 50%;
      object-fit: cover; border: 2px solid var(--green);
    }
    .profile-avatar-placeholder {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--green); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .profile-name { font-size: 16px; font-weight: 700; }
    .profile-phone { font-size: 12px; color: var(--sub); margin-top: 2px; }

    /* ── Notification ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #212121; color: #fff; padding: 10px 20px;
      border-radius: 20px; font-size: 13px; z-index: 999;
      opacity: 0; transition: opacity .3s;
      pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<!-- ════════════════ SCREEN: Loading ════════════════ -->
<div id="screen-loading">
  <div class="spinner"></div>
  <div class="loading-text">กำลังเชื่อมต่อ LINE...</div>
</div>

<!-- ════════════════ SCREEN: Portal ════════════════ -->
<div id="screen-portal" class="screen">

  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-logo">🛡️</div>
    <div class="topbar-title">ISARA INTER BROKER</div>
    <div class="topbar-name" id="topbar-name"></div>
  </div>

  <!-- Tab Bar -->
  <div class="tabbar">
    <button class="tab-btn active" onclick="switchTab('overview')">📊 ภาพรวม</button>
    <button class="tab-btn" onclick="switchTab('installments')">📋 งวด</button>
    <button class="tab-btn" onclick="switchTab('policies')">🛡️ กธ. <span id="renewal-badge" style="display:none;background:#e53935;color:#fff;border-radius:99px;font-size:10px;padding:1px 5px;margin-left:2px;"></span></button>
    <button class="tab-btn" onclick="switchTab('history')">🧾 ประวัติ</button>
  </div>

  <!-- ── Tab: Overview ── -->
  <div id="tab-overview" class="content">

    <!-- Profile -->
    <div class="profile-header" id="profile-block"></div>

    <!-- Outstanding Banner -->
    <div id="outstanding-banner"></div>

    <!-- Next Due -->
    <div id="next-due-banner"></div>

    <!-- Summary Strip -->
    <div class="summary-strip" id="summary-strip"></div>

    <!-- Vehicle Quick View (first 3 installments) -->
    <div id="quick-vehicles"></div>

  </div>

  <!-- ── Tab: Installments ── -->
  <div id="tab-installments" class="content" style="display:none;">
    <div id="vehicle-groups"></div>
  </div>

  <!-- ── Tab: Policies (ต่ออายุกรมธรรม์) ── -->
  <div id="tab-policies" class="content" style="display:none;">
    <div id="policy-list"></div>
  </div>

  <!-- ── Tab: History ── -->
  <div id="tab-history" class="content" style="display:none;">
    <div class="card" id="history-list"></div>
  </div>

</div>

<!-- ════════════════ SCREEN: Register ════════════════ -->
<div id="screen-register" class="screen">
  <div class="topbar">
    <div class="topbar-logo">🛡️</div>
    <div class="topbar-title">ISARA INTER BROKER</div>
  </div>
  <div class="content">
    <div class="form-hero">
      <div class="form-hero-logo">🚗</div>
      <div class="form-hero-title">ลงทะเบียนรับแจ้งเตือน</div>
      <div class="form-hero-sub">กรอกทะเบียนรถที่ผ่อนชำระกับเรา<br>เพื่อรับการแจ้งเตือนผ่าน LINE อัตโนมัติ</div>
    </div>
    <div class="card">
      <div class="form-group">
        <label class="form-label">ทะเบียนรถ <span style="color:var(--red)">*</span></label>
        <input id="input-plate" class="form-input" type="text" placeholder="เช่น กข 1234 หรือ 1กข1234"
               autocomplete="off" oninput="this.value=this.value.toUpperCase()" />
        <div class="form-hint">ใส่ทะเบียนรถที่ผ่อนชำระกับ ISARA</div>
      </div>
      <div class="form-group">
        <label class="form-label">เบอร์โทรศัพท์ <span style="color:var(--sub)">(ไม่บังคับ)</span></label>
        <input id="input-phone" class="form-input" type="tel" placeholder="เช่น 081-234-5678" />
      </div>
      <button class="btn-submit" id="btn-register" onclick="submitRegister()">
        ✅ ลงทะเบียน
      </button>
    </div>
    <div id="register-result"></div>
  </div>
</div>

<!-- ════════════════ SCREEN: Error ════════════════ -->
<div id="screen-error" class="screen">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;">
    <div style="font-size:56px;margin-bottom:16px;">⚠️</div>
    <div style="font-size:18px;font-weight:700;margin-bottom:8px;">เกิดข้อผิดพลาด</div>
    <div id="error-msg" style="font-size:14px;color:#757575;text-align:center;line-height:1.6;"></div>
    <button class="btn-secondary" onclick="location.reload()">ลองใหม่</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════
//  CONFIG — โหลดจาก config.js
// ══════════════════════════════════════════════
const LIFF_ID = ISARA_CONFIG.LIFF_ID;
const GAS_URL = ISARA_CONFIG.GAS_URL;

// ══════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════
let profile = null;   // LINE profile
let data    = null;   // customer data from GAS

// ══════════════════════════════════════════════
//  Boot
// ══════════════════════════════════════════════
window.addEventListener('load', async () => {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }

    profile = await liff.getProfile();
    await loadCustomerData();

  } catch (err) {
    showError('ไม่สามารถเชื่อมต่อ LINE ได้<br>' + err.message);
  }
});

async function loadCustomerData() {
  showScreen('loading');
  try {
    const url = GAS_URL + '?action=getData&userId=' + encodeURIComponent(profile.userId);
    const res = await fetch(url, { redirect: 'follow' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();

    if (!data.success) throw new Error(data.message || 'โหลดข้อมูลไม่สำเร็จ');

    if (data.registered && data.installments && data.installments.length > 0) {
      renderPortal();
      showScreen('portal');
    } else {
      // ยังไม่ลงทะเบียน หรือไม่มีข้อมูล → แสดงฟอร์ม
      showScreen('register');
    }
  } catch (err) {
    showError('โหลดข้อมูลไม่สำเร็จ<br>' + err.message);
  }
}

// ══════════════════════════════════════════════
//  Render Portal
// ══════════════════════════════════════════════
function renderPortal() {
  renderProfile();
  renderSummary();
  renderVehicleGroups();
  renderPolicies();
  renderHistory();
}

function renderProfile() {
  const el = document.getElementById('profile-block');
  const p  = data.profile || {};
  const name = p.displayName || profile.displayName || '';
  const pic  = p.pictureUrl  || profile.pictureUrl  || '';
  el.innerHTML = pic
    ? `<img class="profile-avatar" src="${esc(pic)}" onerror="this.style.display='none'" />
       <div><div class="profile-name">${esc(name)}</div>
       <div class="profile-phone">${p.phone ? '📞 ' + esc(p.phone) : '&nbsp;'}</div></div>`
    : `<div class="profile-avatar-placeholder">👤</div>
       <div><div class="profile-name">${esc(name)}</div></div>`;

  document.getElementById('topbar-name').textContent = name;
}

function renderSummary() {
  const s = data.summary || {};

  // Outstanding banner
  const obEl = document.getElementById('outstanding-banner');
  if (s.totalDue > 0) {
    obEl.innerHTML = `
      <div>
        <div class="ob-label">ยอดค้างชำระรวม</div>
        <div class="ob-amount">${fmt(s.totalDue)} บาท</div>
        <div class="ob-note">${s.pendingCount} งวด${s.overdueCount > 0 ? ` · เกินกำหนด ${s.overdueCount} งวด` : ''}</div>
      </div>
      <div class="ob-icon">${s.overdueCount > 0 ? '⚠️' : '💰'}</div>`;
    obEl.className = 'outstanding-banner';
  } else {
    obEl.innerHTML = `
      <div>
        <div class="ob-label">สถานะการชำระ</div>
        <div class="ob-amount" style="font-size:18px">ชำระครบทุกงวด</div>
        <div class="ob-note">ยอดค้างชำระ 0 บาท</div>
      </div>
      <div class="ob-icon">✅</div>`;
    obEl.className = 'outstanding-banner none';
  }

  // Next due banner
  const ndEl = document.getElementById('next-due-banner');
  const nd   = s.nextDue;
  if (nd) {
    const days = nd.daysLeft;
    const col  = days <= 3 ? '#e65100' : '#1565c0';
    ndEl.innerHTML = `
      <div class="next-due" style="background:linear-gradient(135deg,${col},${col}cc)">
        <div>
          <div class="nd-label">งวดถัดไปที่ต้องชำระ</div>
          <div class="nd-val">฿${fmt(nd.amount)}</div>
          <div class="nd-sub">กรมธรรม์ ${esc(nd.policyNumber)} · งวด ${nd.installmentNo}/${nd.totalInstallments}</div>
          <div class="nd-sub">ครบกำหนด ${esc(nd.dueDate)}</div>
        </div>
        <div class="nd-days">
          <div class="nd-days-num">${days}</div>
          <div class="nd-sub">วัน</div>
        </div>
      </div>`;
  }

  // Summary strip
  document.getElementById('summary-strip').innerHTML = `
    <div class="summary-box">
      <div class="val green">${s.paidCount || 0}</div>
      <div class="lbl">ชำระแล้ว</div>
    </div>
    <div class="summary-box">
      <div class="val orange">${s.pendingCount || 0}</div>
      <div class="lbl">รอชำระ</div>
    </div>
    <div class="summary-box">
      <div class="val red">${s.overdueCount || 0}</div>
      <div class="lbl">เกินกำหนด</div>
    </div>`;

  // Quick vehicle overview (แสดงบน Overview tab)
  const quickEl = document.getElementById('quick-vehicles');
  const groups  = data.plateGroups || {};
  const plates  = Object.keys(groups);
  if (plates.length === 0) { quickEl.innerHTML = ''; return; }

  let html = '';
  plates.forEach(plate => {
    const rows  = groups[plate];
    const paid  = rows.filter(r => r.status === 'ชำระแล้ว').length;
    const total = rows.length;
    const pct   = total > 0 ? Math.round(paid / total * 100) : 0;
    const policy = rows[0].policyNumber;
    html += `
      <div class="card" style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div>
            <div style="font-size:16px;font-weight:800">🚗 ${esc(plate)}</div>
            <div style="font-size:12px;color:var(--sub)">กรมธรรม์ ${esc(policy)}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:12px;color:var(--sub)">ชำระแล้ว</div>
            <div style="font-size:18px;font-weight:800;color:var(--green)">${paid}/${total}</div>
          </div>
        </div>
        <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
        <div class="progress-label">${pct}% เสร็จสิ้น</div>
      </div>`;
  });
  quickEl.innerHTML = html;
}

function renderVehicleGroups() {
  const groups = data.plateGroups || {};
  const plates = Object.keys(groups);
  const el     = document.getElementById('vehicle-groups');
  if (plates.length === 0) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">ยังไม่มีข้อมูลงวดชำระ</div></div>';
    return;
  }
  let html = '';
  plates.forEach(plate => {
    const rows = groups[plate].sort((a,b) => a.installmentNo - b.installmentNo);
    // หา docUrl จากแถวแรกสุดที่มี
    const docUrl = (rows.find(r => r.docUrl) || {}).docUrl || '';
    const docBtn = docUrl
      ? `<a href="${docUrl}" target="_blank" style="display:inline-flex;align-items:center;gap:4px;
           font-size:12px;color:#1565c0;text-decoration:none;background:#e3f2fd;
           padding:3px 10px;border-radius:8px;margin-left:8px;font-weight:600">📄 ดูกรมธรรม์</a>`
      : '';
    html += `
      <div class="vehicle-group">
        <div class="vehicle-header" style="display:flex;align-items:center;flex-wrap:wrap;gap:4px">
          🚗 ${esc(plate)}${docBtn}
        </div>
        <div class="vehicle-body">`;
    rows.forEach(inst => {
      const { cls, badge, badgeCls, icon } = instStyle(inst);
      const dueText = inst.status === 'ชำระแล้ว'
        ? `ชำระเมื่อ ${esc(inst.paidDate || '—')}`
        : inst.dueDate ? `ครบกำหนด ${esc(inst.dueDate)}` : '';
      html += `
          <div class="inst-row">
            <div class="inst-num ${cls}">${icon}</div>
            <div class="inst-info">
              <div class="inst-policy">กรมธรรม์ ${esc(inst.policyNumber)} · งวด ${inst.installmentNo}/${inst.totalInstallments}</div>
              <div class="inst-amount">฿${fmt(inst.amount)}</div>
              <div class="inst-due">${dueText}</div>
            </div>
            <div class="inst-badge ${badgeCls}">${badge}</div>
          </div>`;
    });
    html += `</div></div>`;
  });
  el.innerHTML = html;
}

function renderPolicies() {
  const policies = data.policies || [];
  const el       = document.getElementById('policy-list');

  // badge จำนวนต้องต่ออายุ
  const urgentCount = policies.filter(p => p.urgent).length;
  const badge = document.getElementById('renewal-badge');
  if (urgentCount > 0) { badge.textContent = urgentCount; badge.style.display = 'inline'; }
  else { badge.style.display = 'none'; }

  if (policies.length === 0) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🛡️</div>
      <div class="empty-text">ยังไม่มีข้อมูลกรมธรรม์<br><span style="font-size:12px">แอดมินจะเพิ่มข้อมูลให้ในชีต "กรมธรรม์"</span></div></div>`;
    return;
  }

  let html = '';
  policies.forEach(pol => {
    const { color, bg, label, icon } = polStyle(pol);
    const docBtn = pol.docUrl
      ? `<a href="${esc(pol.docUrl)}" target="_blank"
            style="display:inline-flex;align-items:center;gap:5px;margin-top:10px;
                   font-size:13px;font-weight:700;color:#1565c0;text-decoration:none;
                   background:#e3f2fd;padding:8px 14px;border-radius:10px;width:100%;
                   justify-content:center">
           📄 ดูกรมธรรม์
         </a>`
      : '';
    html += `
      <div class="card" style="margin-bottom:12px;border-left:4px solid ${color}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
          <div>
            <div style="font-size:15px;font-weight:800">🚗 ${esc(pol.licensePlate || pol.policyNumber)}</div>
            <div style="font-size:12px;color:var(--sub)">${esc(pol.policyType)}${pol.insurer ? ' · ' + esc(pol.insurer) : ''}</div>
          </div>
          <div style="background:${bg};color:${color};font-size:11px;font-weight:700;
                      padding:3px 10px;border-radius:99px;white-space:nowrap">${icon} ${label}</div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px">
          <div style="color:var(--sub)">เลขกรมธรรม์</div>
          <div style="font-weight:600;text-align:right">${esc(pol.policyNumber)}</div>
          ${pol.startDate ? `<div style="color:var(--sub)">วันเริ่มต้น</div>
          <div style="text-align:right">${esc(pol.startDate)}</div>` : ''}
          <div style="color:var(--sub)">วันหมดอายุ</div>
          <div style="font-weight:700;color:${color};text-align:right">${esc(pol.expiryDate)}</div>
          ${pol.premium > 0 ? `<div style="color:var(--sub)">เบี้ยประกัน</div>
          <div style="text-align:right">฿${fmt(pol.premium)}</div>` : ''}
        </div>
        ${pol.urgent ? `
        <div style="margin-top:10px;background:#fff3e0;border-radius:8px;padding:8px 10px;
                    font-size:12px;color:#e65100;display:flex;align-items:center;gap:6px">
          ⚠️ กรุณาติดต่อต่ออายุก่อนวันหมดอายุ
        </div>` : ''}
        ${docBtn}
      </div>`;
  });
  el.innerHTML = html;
}

function polStyle(pol) {
  if (pol.status === 'ต่ออายุแล้ว')
    return { color:'#1565c0', bg:'#e3f2fd', label:'ต่ออายุแล้ว', icon:'✅' };
  if (pol.status === 'ยกเลิก')
    return { color:'#757575', bg:'#f5f5f5', label:'ยกเลิก', icon:'—' };
  if (pol.daysLeft !== null && pol.daysLeft <= 0)
    return { color:'#c62828', bg:'#ffebee', label:'หมดอายุแล้ว', icon:'🚨' };
  if (pol.daysLeft !== null && pol.daysLeft <= 7)
    return { color:'#e53935', bg:'#ffebee', label:`อีก ${pol.daysLeft} วัน`, icon:'⚠️' };
  if (pol.daysLeft !== null && pol.daysLeft <= 30)
    return { color:'#e65100', bg:'#fff3e0', label:`อีก ${pol.daysLeft} วัน`, icon:'🔔' };
  return { color:'#2e7d32', bg:'#e8f5e9', label:'มีผลบังคับ', icon:'🛡️' };
}

function renderHistory() {
  const hist = data.history || [];
  const el   = document.getElementById('history-list');
  if (hist.length === 0) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🧾</div><div class="empty-text">ยังไม่มีประวัติการชำระ</div></div>';
    return;
  }
  let html = '<div class="card-title">ประวัติการชำระ</div>';
  hist.slice(0, 50).forEach(h => {
    const icon = h.status === 'ยืนยัน' || h.status === 'ชำระแล้ว' ? '✅' : h.status === 'ปฏิเสธ' ? '❌' : '💰';
    html += `
      <div class="hist-row">
        <div class="hist-icon">${icon}</div>
        <div class="hist-info">
          <div class="hist-title">กรมธรรม์ ${esc(h.policyNumber)} · งวด ${h.installmentNo}</div>
          <div class="hist-sub">${esc(h.date)}${h.note ? ' · ' + esc(h.note) : ''}</div>
        </div>
        <div class="hist-amount">฿${fmt(h.amount)}</div>
      </div>`;
  });
  el.innerHTML = html;
}

// ══════════════════════════════════════════════
//  Tab Switch
// ══════════════════════════════════════════════
function switchTab(tab) {
  ['overview','installments','policies','history'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === tab ? 'block' : 'none';
  });
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', ['overview','installments','policies','history'][i] === tab);
  });
}

// ══════════════════════════════════════════════
//  Registration
// ══════════════════════════════════════════════
async function submitRegister() {
  const plate = document.getElementById('input-plate').value.trim().replace(/\s+/g,'').toUpperCase();
  const phone = document.getElementById('input-phone').value.trim();
  const btn   = document.getElementById('btn-register');
  const res   = document.getElementById('register-result');

  if (!plate) { showToast('กรุณาใส่ทะเบียนรถ'); return; }

  btn.disabled = true;
  btn.textContent = '⏳ กำลังดำเนินการ...';
  res.innerHTML = '';

  try {
    const payload = {
      userId:      profile.userId,
      displayName: profile.displayName,
      pictureUrl:  profile.pictureUrl || '',
      licensePlate: plate,
      phone: phone,
    };
    const url = GAS_URL + '?action=register&data=' + encodeURIComponent(JSON.stringify(payload));
    const r   = await fetch(url, { redirect: 'follow' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const result = await r.json();

    if (result.success) {
      res.innerHTML = `
        <div class="result-box">
          <div class="result-icon">🎉</div>
          <div class="result-title">ลงทะเบียนสำเร็จ!</div>
          <div class="result-sub">ทะเบียน <b>${esc(result.licensePlate)}</b><br>
          ระบบจะแจ้งเตือนผ่อนชำระผ่าน LINE อัตโนมัติ</div>
          <button class="btn-secondary" onclick="loadCustomerData()">ดูกรมธรรม์ของฉัน →</button>
        </div>`;
      btn.style.display = 'none';
    } else {
      showToast('❌ ' + (result.message || 'ลงทะเบียนไม่สำเร็จ'));
      btn.disabled = false;
      btn.textContent = '✅ ลงทะเบียน';
    }
  } catch (err) {
    showToast('เกิดข้อผิดพลาด: ' + err.message);
    btn.disabled = false;
    btn.textContent = '✅ ลงทะเบียน';
  }
}

// ══════════════════════════════════════════════
//  Helpers
// ══════════════════════════════════════════════
function instStyle(inst) {
  if (inst.status === 'ชำระแล้ว')
    return { cls:'paid', badge:'ชำระแล้ว', badgeCls:'badge-paid', icon:'✓' };
  if (inst.overdue)
    return { cls:'overdue', badge:'เกินกำหนด', badgeCls:'badge-overdue', icon:'!' };
  if (inst.daysLeft !== null && inst.daysLeft <= 7)
    return { cls:'upcoming', badge:`${inst.daysLeft} วัน`, badgeCls:'badge-soon', icon:inst.installmentNo };
  return { cls:'normal', badge:'รอชำระ', badgeCls:'badge-pending', icon:inst.installmentNo };
}

function fmt(n) {
  return Number(n || 0).toLocaleString('th-TH');
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showScreen(name) {
  document.getElementById('screen-loading').style.display = name === 'loading' ? 'flex' : 'none';
  ['portal','register','error'].forEach(s => {
    const el = document.getElementById('screen-' + s);
    if (el) el.classList.toggle('active', s === name);
  });
}

function showError(msg) {
  document.getElementById('error-msg').innerHTML = msg;
  showScreen('error');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
